&lt;svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg"&gt;
  &lt;!-- Background rounded square --&gt;
  <rect width="128" height="128" rx="24" fill="#202a3a"/>
  
  &lt;!-- Shield with gradient --&gt;
  <defs>
    <linearGradient id="shieldGradient" x1="64" y1="25" x2="64" y2="103">
      <stop offset="0%" stop-color="#37ba83"/>
      <stop offset="100%" stop-color="#2d9a6b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  &lt;!-- Shield shape --&gt;
  <path d="M64 25 L35 35 L35 58 C35 77.33 46.67 94.67 64 103 C81.33 94.67 93 77.33 93 58 L93 35 L64 25Z" 
        fill="url(#shieldGradient)" 
        filter="url(#shadow)"
        stroke="rgba(255, 255, 255, 0.2)" 
        stroke-width="1"/>
  
  &lt;!-- Checkmark --&gt;
  <path d="M54 62 L60 68 L74 50" 
        stroke="white" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
